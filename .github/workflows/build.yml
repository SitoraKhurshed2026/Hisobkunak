name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system libs
        run: |
          sudo apt update
          sudo apt install -y zip unzip libncurses5 libtinfo5 libffi-dev libssl-dev libsqlite3-dev libltdl-dev libbz2-dev libzbar0 libgl1-mesa-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build with Buildozer
        env:
          ACCEPT_SDK_LICENSE_AGREEMENTS: "1"
        run: |
          yes | sdkmanager --licenses || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisobkunak-APK
          path: bin/*.apk
